# Sandbox environment for Zaiware.Platform.
#   sbx env plan     review what would change
#   sbx env create   create the sandbox without attaching
#   sbx env run      create, or attach to, the sandbox
#   sbx env rm       destroy the sandbox and its scoped secrets
#
# No arguments are needed for any of these commands.
#
# `sbx env` is experimental; pin your sbx version.
# Keep this file at the workspace root: sbx mounts it read-only so the agent
# cannot change what a later create executes on the host.

schemaVersion: "1"
name: zaiware-platform
agent: opencode

sandboxOptions:
  pullPolicy: always

# No entrypoint/cmd override on purpose. An attached `sbx env run` is an
# exec-style session inside the sandbox: its process (and anything it spawned
# in the foreground) is torn down when the session ends, so a `cmd: [serve, ...]`
# server dies with the terminal. long-running@1 stops the sandbox from
# auto-stopping, it does not keep a session process alive.
# The API server is started by the opencode-server kit's lifecycle startup hook
# at boot instead, and the sandbox is started without attaching:
#   sbx env create

# Mounts the directory containing this file. Clone mode: the sandbox works in a
# private git clone of the workspace instead of a bind mount, so host and sandbox
# changes only meet through git (push/fetch). Same as the old `--clone` flag;
# override per invocation with --clone=false.
workspace:
  path: .
  clone: true

# The server password never passes through sbx — no `args:`, no `env:` — so it
# never appears in command history, process listings, or the plan that
# `sbx env plan`/`create`/`run` prints. It lives in a host directory OUTSIDE
# this repo (sibling: ..\zaiware-secrets), mounted read-only below, and the
# opencode-server boot hook reads it at every boot. Rotate it by editing the
# file; the change takes effect on the next sandbox boot.
#
# This does not hide the value from the agent — the mount is readable inside
# the sandbox and the server runs there. The password protects the published
# host port from other host processes, not secrets from the agent.
additionalWorkspaces:
  # Omitting `target:` mounts the directory at its host path inside the
  # sandbox, so it is always reachable at "$WORKSPACE_DIR/../zaiware-secrets"
  # regardless of where the workspace itself lives.
  - path: ../zaiware-secrets
    readOnly: true

kits:
  # Network access + credential injection. Adds no files to the image.
  - ./sbx/kits/provider-keys
  # Keeps the sandbox (and the server) alive after the last client disconnects,
  # and persists OpenCode state in a volume across sandbox recreation.
  - ./sbx/kits/opencode-server
  - ./sbx/kits/dotnet
  # Aspire CLI and the environment an AppHost needs (DOTNET_ROOT, DCP IPv4,
  # HTTP transport). Must be listed after the dotnet kit.
  - ./sbx/kits/aspire
  # OpenSpec CLI (standalone binary, no Node). Project artifacts under
  # openspec/ and .agents/skills come from `openspec init` in the repo.
  - ./sbx/kits/openspec

# Publish the API server on host loopback only, explicitly.
ports:
  - sandbox: 4096
    host: 4096
    hostIP: 127.0.0.1
    protocol: tcp4

# Secret provisioning. Prefer one of these two paths:
#
#   1) Host-scoped, once (persists across sandbox recreation):
#        sbx secret set opencode-go
#
#   2) Declared here, provisioned per sandbox on create:
#
# secrets:
#   opencode-go:
#     command: 'gh auth token'                   # or any host command
#
# Never use `value:` — it stores plaintext in this file.

bindings:
  opencode-go:
    apiKey:
      domains:
        - opencode.ai
