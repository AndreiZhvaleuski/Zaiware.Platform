# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: OpenCode provider keys (OpenCode Go)

# Grants only: network reachability and credential injection.
# The provider -> env var mapping lives in .opencode/opencode.json, not here.
# DeepSeek models are served through OpenCode Go (opencode-go/deepseek-*),
# so there is no native DeepSeek credential anymore.

capabilities:
  # Focused agent guidance: the key is a proxy-managed placeholder.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./provider-keys-context.md

  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - opencode.ai:443
          # Model catalog and other first-party subdomains. Keep the apex entry
          # above because a wildcard does not cover it.
          - "*.opencode.ai:443"

  # OpenCode Go (hosted inference at opencode.ai). Key value resolves from the
  # host secret `opencode-go`.
  - type: com.docker.sandbox/credential@1
    config:
      service: opencode-go
      phase: runtime
      apiKey:
        name: OPENCODE_API_KEY
        proxyManaged: true
        inject:
          # Keep the key scoped to the apex. The model-catalog subdomain is
          # network-allowed above, but it must not receive the key until that
          # endpoint is confirmed to require it.
          - domain: opencode.ai
            header: Authorization
            format: "Bearer %s"
