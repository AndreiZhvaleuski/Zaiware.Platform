# syntax=docker/sandbox-kit:3
# OpenSpec CLI for the sandbox, installed with OpenSpec's official standalone
# installer (no Node.js runtime).
#
# Why baked and not a startup hook: a Kit layer is part of the image digest, so
# every `sbx env rm` / `sbx env run` gets the same binary with no download. The
# version is pinned by `openspecVersion`; bump it and recreate to upgrade.
#
# The installer verifies the release archive against the release's SHA256SUMS
# and drops the native binary in ~/.local/bin, which the OpenCode workload
# already has on PATH. The binary needs only glibc, which the workload ships.
#
# Project state does not live here: `openspec init` writes openspec/,
# .agents/skills/openspec-*, and .opencode/commands/openspec-* into the
# workspace, so they survive recreation with the repository. The CLI's own
# per-machine state (~/.config/openspec) is disposable, so no volume is needed.
#
# No network-policy capability on purpose. The OpenCode workload already allows
# github.com, api.github.com, and *.githubusercontent.com, which is all
# `openspec update` needs. The installer itself runs at image build time on the
# host. openspec.dev is not granted, so an in-sandbox `openspec install`
# self-update is not available; bump `openspecVersion` instead.
schemaVersion: "3"
displayName: OpenSpec CLI
description: >-
  The OpenSpec CLI, installed with OpenSpec's standalone installer (no Node.js
  needed). Adds no network rules of its own.
sourceUrl: https://openspec.dev/docs/installation
licenses: [MIT]

kind: mixin

provides:
  - "openspec@${{ kit.args.openspecVersion }}"

args:
  openspecVersion:
    default: "2.0.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: Exact OpenSpec CLI version to install
    buildArg: OPENSPEC_VERSION

  telemetry:
    default: "0"
    description: Anonymous usage telemetry (0 disables it; the sandbox grants no telemetry host)
    env: OPENSPEC_TELEMETRY
