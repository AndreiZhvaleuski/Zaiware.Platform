# syntax=docker/sandbox-kit:3
# OpenSpec CLI for the sandbox, installed with OpenSpec's official standalone
# installer (no Node.js runtime).
#
# Why baked and not a startup hook: a Kit layer is part of the image digest, so
# every `sbx env rm` / `sbx env run` gets the same binary with no download. The
# version is pinned by `openspecVersion`; bump it and recreate to upgrade.
#
# The installer verifies the release archive against the release's SHA256SUMS
# and drops the native binary in the official default, ~/.local/bin, which the
# shell workload already has on PATH. The binary needs only glibc, which the
# workload ships. A /usr/local/bin symlink gives every kit the same PATH entry.
#
# Project state does not live here: `openspec init` writes openspec/ and
# .agents/skills/openspec-* into the workspace, so they survive recreation with
# the repository. The CLI's per-machine state (~/.config/openspec and
# ~/.local/share/openspec) is disposable, so no volume is needed.
#
# The network rules cover runtime updates and GitHub repository operations.
# The installer itself runs at image build time on the host and needs no sandbox
# runtime grant.
schemaVersion: "3"
displayName: OpenSpec CLI
description: >-
  The OpenSpec CLI, installed with OpenSpec's standalone installer (no Node.js
  needed), plus the GitHub runtime access its update workflow uses.
sourceUrl: https://openspec.dev/docs/installation
licenses: [MIT]

kind: mixin

capabilities:
  # Focused agent guidance: project artifacts and OpenSpec workflow skills.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./openspec-context.md

  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - github.com:443
          - api.github.com:443
          - "*.githubusercontent.com:443"

provides:
  - "openspec@${{ kit.args.openspecVersion }}"

args:
  openspecVersion:
    default: "2.0.0"
    pattern: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    description: Exact OpenSpec CLI version to install (bare or v-prefixed)
    buildArg: OPENSPEC_VERSION
