# syntax=docker/sandbox-kit:3
# Aspire CLI for the sandbox, installed with Aspire's official install script.
#
# Why baked and not a startup hook: a Kit layer is part of the image digest, so
# every `sbx env rm` / `sbx env run` gets the same CLI with no download. The
# version is pinned by `aspireVersion`; bump it together with the AppHost SDK
# version in Zaiware.Platform.AppHost.csproj and Directory.Packages.props.
#
# The environment arguments fix two things an AppHost needs in this sandbox:
#
#   * DOTNET_ROOT: the dotnet Kit installs a dotnetup-managed SDK in
#     /home/agent/.local/share/dotnetup, not /usr/share/dotnet. `dotnet` works
#     through its /usr/local/bin symlink, but the apphost executable that
#     Aspire/DCP launches directly searches DOTNET_ROOT and exits with
#     "You must install .NET to run this application" without it.
#   * DCP endpoints: DCP normally binds [::1], which the sandbox proxy does not
#     bypass. DCP_IP_VERSION_PREFERENCE=IPv4 makes it use 127.0.0.1, which the
#     sandbox's own NO_PROXY already covers. The mixin does not override
#     NO_PROXY: clients that parse it as a regex can lose their proxy, and the
#     sandbox may add its own bypass entries.
#
# ASPIRE_ALLOW_UNSECURED_TRANSPORT is for the AppHost's `http` launch profile.
# The image ships no trusted ASP.NET Core HTTPS development certificate, and the
# sandbox publishes only loopback ports, so HTTP keeps host access simple.
schemaVersion: "3"
displayName: Aspire CLI
description: >-
  The Aspire CLI, installed with Aspire's official install script, plus the
  .NET root, proxy bypasses, and HTTP transport opt-in an AppHost needs inside
  the sandbox.
sourceUrl: https://aspire.dev/get-started/install-cli/
licenses: [MIT]

kind: mixin

# The AppHost needs a .NET 10 SDK. This also guarantees the dotnet Kit is in the
# set, so `dotnet` is on PATH when the Aspire CLI builds the AppHost.
requires:
  - "dotnet >= 10.0.100"

provides:
  - "aspire@${{ kit.args.aspireVersion }}"

args:
  aspireVersion:
    default: "13.6.4"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: Exact Aspire CLI version to install; keep in sync with the AppHost SDK
    buildArg: ASPIRE_VERSION

  allowUnsecuredTransport:
    default: "true"
    description: Allow the AppHost's HTTP launch profile (no trusted dev certificate in the image)
    env: ASPIRE_ALLOW_UNSECURED_TRANSPORT

  # DCP's default endpoint address in this sandbox is [::1]. The proxy does not
  # bypass the bracketed IPv6 literal, so DCP connections fail with a 502.
  # Preferring IPv4 makes DCP use 127.0.0.1, which the standard NO_PROXY
  # entries already cover, without the regex hazard of a [::1] entry.
  dcpIpVersionPreference:
    default: "IPv4"
    description: Prefer IPv4 for DCP endpoints so loopback traffic bypasses the proxy
    env: DCP_IP_VERSION_PREFERENCE

  cliTelemetryOptOut:
    default: "true"
    description: Disable Aspire CLI usage telemetry
    env: ASPIRE_CLI_TELEMETRY_OPTOUT

capabilities:
  # NuGet is also granted by the dotnet Kit. It stays here because the Aspire
  # mixin restores and builds the AppHost itself, and a Kit should carry the
  # access its own commands need.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.nuget.org:443
          - "*.nuget.org:443"
          # `aspire update`, the update check, and `aspire docs` use these.
          - github.com:443
          - objects.githubusercontent.com:443
          - ci.dot.net:443
          - aka.ms:443
          - aspire.dev:443
          # The dashboard image, if the CLI starts it as a container.
          - mcr.microsoft.com:443
