# syntax=docker/sandbox-kit:3
# Aspire CLI for the sandbox, installed with Aspire's official install script.
#
# Why baked and not a startup hook: a Kit layer is part of the image digest, so
# every `sbx env rm` / `sbx env run` gets the same CLI with no download. The
# version is pinned by `aspireVersion`; bump it together with the Aspire
# package versions in Zaiware.Platform.AppHost.csproj and Directory.Packages.props.
#
# The environment arguments fix two things an AppHost needs in this sandbox:
#
#   * DOTNET_ROOT comes from the dotnet Kit. The apphost executable that
#     Aspire/DCP launches directly searches DOTNET_ROOT and exits with
#     "You must install .NET to run this application" without it.
#   * DCP normally binds [::1], which the sandbox proxy does not bypass.
#     DCP_IP_VERSION_PREFERENCE=IPv4 makes it use 127.0.0.1, which the
#     sandbox's own NO_PROXY already covers.
#
# The Kit declares `provides` but no `requires`. The dotnet Kit must be present;
# list it before this one in sbxenv.yaml. `requires` is valid v3 and resolved at
# sandbox creation, but it is not adopted until the isolated probe in
# sbx/MIXINS.md passes. The runtime network policy below covers the container
# registries Aspire/DCP pulls from; the dotnet Kit separately grants NuGet.
#
# ASPIRE_ALLOW_UNSECURED_TRANSPORT is for the AppHost's `http` launch profile:
# the sandbox publishes only loopback ports, so HTTP keeps host access simple.
# A trusted ASP.NET Core HTTPS development certificate is still provisioned per
# sandbox by the lifecycle hooks below, because `aspire doctor` and any HTTPS
# launch profile expect one. The certificate is generated in the sandbox, never
# baked into the image, so each sandbox has its own private key.
#
# `libnss3-tools` comes from apt at create time, not from the overlay: apt
# packages need the composed base's dpkg database and library closure, the same
# split the published Playwright kit uses for Chromium's system libraries. The
# install-phase grant below covers only the Debian package host that needs.
schemaVersion: "3"
displayName: Aspire CLI
description: >-
  The Aspire CLI, installed with Aspire's official install script, plus the
  .NET root, IPv4 DCP preference, HTTP transport opt-in, and a trusted
  per-sandbox development certificate that an AppHost needs inside the sandbox.
sourceUrl: https://aspire.dev/get-started/install-cli/
licenses: [MIT]

kind: mixin

capabilities:
  # Focused agent guidance: HTTP profile, configured environment, safe commands.
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./aspire-context.md

  # Runtime egress for Aspire/DCP container image pulls. Docker Hub credentials
  # and blob redirects use auth.docker.io and Cloudflare/CloudFront/R2; MCR
  # serves the Aspire dashboard and Microsoft base images.
  - type: com.docker.sandbox/network-policy@1
    config:
      # The lifecycle install hook apt-installs libnss3-tools (certutil) on
      # every create. Install-only: nothing the agent does reaches apt.
      install:
        allow:
          - deb.debian.org
      runtime:
        allow:
          # Docker Hub registry and token service. The wildcard also covers a
          # future registry-2; the apex entry is required because a wildcard
          # does not cover it.
          - docker.io:443
          - "*.docker.io:443"
          - production.cloudflare.docker.com:443
          - "*.cloudflare.docker.com:443"
          - production.cloudfront.docker.com:443
          - "*.cloudfront.docker.com:443"
          - "*.r2.cloudflarestorage.com:443"
          - mcr.microsoft.com:443
          - "*.mcr.microsoft.com:443"

  # Create-time and boot-time certificate work. The install hook runs as root
  # and is what pays the apt cost; the startup hook runs as the agent who owns
  # the certificate and is a no-op once a trusted certificate exists.
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -euo pipefail
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libnss3-tools
            rm -rf /var/lib/apt/lists/*
          user: "0"
          env:
            - HTTP_PROXY
            - HTTPS_PROXY
          description: Install certutil for development-certificate trust
      startup:
        - command: |
            set -e
            : "${SSL_CERT_DIR:=/usr/lib/ssl/certs:$HOME/.aspnet/dev-certs/trust}"
            export SSL_CERT_DIR
            if ! dotnet dev-certs https --check --trust >/dev/null 2>&1; then
              aspire certs trust --non-interactive
            fi
          env:
            - HOME
            - PATH
            - DOTNET_ROOT
            - SSL_CERT_DIR
          user: agent
          description: Create and trust the per-sandbox HTTPS development certificate

# Declarative identity only; no `requires` (see the header comment).
provides:
  - "aspire@${{ kit.args.aspireVersion }}"

args:
  aspireVersion:
    default: "17.0.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: Exact Aspire CLI version to install; keep in sync with the Aspire AppHost packages
    buildArg: ASPIRE_VERSION

  allowUnsecuredTransport:
    default: "true"
    description: Allow the AppHost's HTTP launch profile without requiring HTTPS
    env: ASPIRE_ALLOW_UNSECURED_TRANSPORT

  sslCertDir:
    default: "/usr/lib/ssl/certs:/home/agent/.aspnet/dev-certs/trust"
    description: OpenSSL trust directories, including the per-sandbox development certificate
    env: SSL_CERT_DIR

  # DCP's default endpoint address in this sandbox is [::1]. The proxy does not
  # bypass the bracketed IPv6 literal, so DCP connections fail with a 502.
  # Preferring IPv4 makes DCP use 127.0.0.1, which the standard NO_PROXY
  # entries already cover, without the regex hazard of a [::1] entry.
  dcpIpVersionPreference:
    default: "IPv4"
    description: Prefer IPv4 for DCP endpoints so loopback traffic bypasses the proxy
    env: DCP_IP_VERSION_PREFERENCE

  cliTelemetryOptOut:
    default: "true"
    description: Disable Aspire CLI usage telemetry
    env: ASPIRE_CLI_TELEMETRY_OPTOUT
