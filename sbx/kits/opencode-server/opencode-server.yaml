# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: OpenCode server
description: >-
  Pinned OpenCode CLI/server binary for the shell workload, API server startup
  hook, persistent OpenCode session data, and injected sandbox workflow
  instructions.
sourceUrl: https://opencode.ai/docs/
licenses: [MIT]

provides:
  - "opencode@${{ kit.args.opencodeVersion }}"

args:
  opencodeVersion:
    default: "2.4.1"
    pattern: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    description: Exact OpenCode version to install (bare or v-prefixed)
    buildArg: OPENCODE_VERSION

# The companion Dockerfile installs the pinned glibc binary with OpenCode's
# official v2 installer. Bump opencodeVersion and recreate to upgrade. This
# mixin must compose with the shell workload, not the opencode workload, which
# already provides the same feature and binary paths.
#
# Runs `opencode serve` on every sandbox boot, in the background, so the API
# server is not tied to an sbx session. long-running@1 keeps the sandbox alive
# after the last client disconnects.
#
# Why not a `cmd:` launch override: that runs inside the attached session and
# is torn down when the session ends. Why not a plain background process
# either: only a boot hook is restarted by the runtime, not by the client.
#
# The server password is NOT passed through the sandbox environment: sbxenv
# declares no arg and no env entry for it, so it never appears in command
# history or the environment plan. The hook reads it at boot from the
# read-only ../zaiware-secrets/server-password additional workspace (a
# sibling of the repo on the host). The file is readable by the agent, same
# as the old env var was: the password protects the published host port from
# other host processes, not secrets from the agent. `test -s` makes a missing
# or empty file fail the hook, so the port is never served unauthenticated,
# and `tr -d '\r\n'` strips the line ending Windows editors leave behind.
#
# Install hooks are deny-by-default. In sbx, startup hooks receive the full
# sandbox environment; the v3 spec says deny-by-default. Keep this list for
# portability and to document what the server needs. The cd sets the server's
# project root to the mounted workspace instead of the image WORKDIR.
#
# OpenCode stores sessions, messages, auth, logs, and snapshots under
# ~/.local/share/opencode, its default when XDG_DATA_HOME is unset. volume@1
# gives that directory a block volume keyed by sandbox name, so `sbx env rm`
# followed by a create reattaches the same data. The install hook owns a
# freshly created mount root before any agent hook writes to it.

capabilities:
  # OpenCode reads global instructions from AGENTS.md in its config directory.
  # agent-context@1 generates that file and adds a kit index entry pointing to
  # the context staged from contentFile. The kit frontend stages contentFile;
  # do not copy it in the Dockerfile as well.
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
      directory: /home/agent/.config/opencode
      contentFile: ./opencode-server-context.md

  - type: com.docker.sandbox/volume@1
    config:
      path: /home/agent/.local/share/opencode
      mode: "0755"

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: install -d -o agent -g agent -m 0755 /home/agent/.local/share/opencode
          user: "0"
          description: Make the OpenCode data volume writable by agent
        - command: install -d -o agent -g agent -m 0755 /home/agent/.local/share/opencode/duende-mcp
          user: "0"
          description: Make the Duende MCP index directory writable by agent
        - command: mkdir -p /home/agent/.config/opencode && chown agent:agent /home/agent/.config /home/agent/.config/opencode
          user: "0"
          description: Make the OpenCode config directory writable by agent
      startup:
        - command: |
            set -e
            [ -n "$MCP_GATEWAY_URL" ] || exit 0
            mkdir -p "$HOME/.config/opencode"
            cfg="$HOME/.config/opencode/opencode.json"
            frag=/tmp/sandbox-mcp-gateway.json
            jq -n --arg url "$MCP_GATEWAY_URL" --arg auth "Bearer $MCP_SENTINEL_TOKEN_NAME" \
              '{"$schema": "https://opencode.ai/config.json", mcp: {"mcp-gateway": {type: "remote", url: $url, enabled: true, headers: {Authorization: $auth}}}}' > "$frag"
            [ -f "$cfg" ] || echo '{}' > "$cfg"
            jq -s '.[0] * .[1]' "$cfg" "$frag" > "$cfg.tmp"
            mv "$cfg.tmp" "$cfg"
            rm -f "$frag"
          env:
            - HOME
            - MCP_GATEWAY_URL
            - MCP_SENTINEL_TOKEN_NAME
          user: agent
          description: Register the sandbox MCP gateway with OpenCode
        - command: cd "$WORKSPACE_DIR" && test -s ../zaiware-secrets/server-password && export OPENCODE_SERVER_PASSWORD="$(tr -d '\r\n' < ../zaiware-secrets/server-password)" && exec opencode serve --hostname 0.0.0.0 --port 4096
          env:
            - WORKSPACE_DIR
            - OPENCODE_API_KEY
            - HTTP_PROXY
            - HTTPS_PROXY
            - NO_PROXY
          background: true
          description: OpenCode API server

  - type: com.docker.sandbox/long-running@1
